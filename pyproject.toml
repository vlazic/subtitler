[project]
name = "subtitler"
version = "0.1.0"
description = "Audio or video in, burned-in subtitles out. Local-first, macOS and Linux."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vladimir Lazic" }]
keywords = ["subtitles", "whisper", "transcription", "srt", "vtt", "ffmpeg"]

# Core stays deliberately thin: stdlib plus ffmpeg invoked as a subprocess.
# Everything heavy lives behind an extra so `uv sync` on a fresh Mac is fast.
dependencies = [
  "huggingface-hub>=0.24",
]

[project.optional-dependencies]
# macOS Apple Silicon only. Never a hard dependency: there are no Linux wheels.
mlx = ["mlx-whisper>=0.4"]
# Linux, Intel Mac, or any CPU box.
local = ["faster-whisper>=1.1", "numpy>=1.24"]
# CTranslate2 wheels want CUDA 12 even when the driver ships 13.
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
cloud = ["groq>=0.12"]
# tenacity is what LiteLLM imports to honour `num_retries`, and it does not depend on it
# itself. Without it the first retryable error becomes "tenacity import failed", which
# hides the real one: a run with no API key reported a missing package, not a missing key.
# Pure Python, so non-negotiable 6 still holds.
fix = ["litellm>=1.50", "tenacity>=8"]
# Fetching a URL. Pure Python, so non-negotiable 6 holds, and optional because a run over a
# local file must neither import it nor require it. Sites change their pages constantly, so
# a yt-dlp older than a few months is the usual reason a download stops working:
# `uv sync --extra fetch --upgrade-package yt-dlp`.
fetch = ["yt-dlp>=2025.1.15"]
# Benchmark-only denoisers, ported from gozba2/py/test.py. Not a runtime dep:
# the CLI denoises with ffmpeg filters instead.
denoise = ["noisereduce>=3.0", "librosa>=0.10", "soundfile>=0.12", "numpy>=1.24"]
bench = ["jiwer>=3.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
subtitler = "subtitler.cli:main"

[project.urls]
Repository = "https://github.com/vlazic/subtitler"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subtitler"]

[tool.hatch.build.targets.wheel.force-include]
# Only paths from OUTSIDE the package belong here. `packages = ["subtitler"]` already
# carries everything under `subtitler/`, including `assets/` and `gui/static/`, and naming
# one of them again is not belt-and-braces: hatchling refuses the second copy with
# "A second file is being added to the wheel archive at the same path", so `uv build`
# fails outright. `subtitler/assets` was listed here and did exactly that.
# The post-edit prompts live at the repo root so they are obvious and editable in a
# checkout, and are copied into the package so an installed wheel can still find them.
# `postedit.PROMPT_DIRS` looks in both places.
"prompts" = "subtitler/prompts"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# RUF001 flags characters that look like ASCII but are not, which is exactly what a
# Cyrillic-to-Latin table is made of: `с` really is CYRILLIC SMALL LETTER ES and really
# does map to `s`. The rule is right everywhere else in this project and is kept on.
"subtitler/bench/normalize.py" = ["RUF001"]
"tests/test_bench_normalize.py" = ["RUF001"]
"tests/test_bench_metrics.py" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
