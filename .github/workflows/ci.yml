name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS is the primary target and the maintainer develops on Linux, so the mac job
    # runs from the first phase rather than at the end. macos-14 is Apple Silicon.
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            extras: "--extra local --extra cloud --extra dev"
          - os: macos-14
            extras: "--extra mlx --extra cloud --extra dev"

    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        # Two things bite here, both verified from CI output rather than guessed:
        #
        # 1. The runner image preinstalls an ffmpeg 8.1.2 into /opt/homebrew/bin whose
        #    configuration line carries --enable-libx264 and NOT --enable-libass. Burn-in
        #    needs libass, so that binary is unusable for this project.
        # 2. The image leaves an untrusted tap (aws/tap) configured, which puts Homebrew
        #    into a mode where `brew install` prints "Would install ..." and does nothing.
        #    Untapping is what the warning itself recommends.
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        # 3. Homebrew has split the formula. The regular `ffmpeg` bottle is built WITHOUT
        #    libass; `ffmpeg-full` is the one that carries it. This is the single most
        #    important macOS setup fact for this project, because burn-in is the whole
        #    point and `brew install ffmpeg` is what everyone types.
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install ffmpeg-full || brew install ffmpeg
          brew link --overwrite --force ffmpeg-full 2>/dev/null || true
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Record the ffmpeg build
        run: |
          # Which binary, and what it was built with. A machine can have several ffmpegs
          # and only one of them carries libass; without this, a capability failure is
          # unattributable.
          which -a ffmpeg || true
          ffmpeg -version | head -1
          ffmpeg -version | tr ' ' '\n' | grep -E '^--enable-(libass|libx264|libfreetype|libfontconfig)$' || \
            echo "NOTE: none of libass/libx264/freetype/fontconfig in the configuration line"
          ffmpeg -version | grep -q -- --enable-libass \
            || { echo "this ffmpeg has no libass; burn-in cannot work with it"; exit 1; }
          # Everything this project needs must exist on both the 4.4 Ubuntu ships and the
          # 8.x Homebrew ships. Ask about each capability individually: the `-filters`
          # table's column layout is not stable across releases, so grepping it produced
          # a false "ass is missing" on Homebrew 8.1.
          for f in ass subtitles afftdn arnndn anlmdn; do
            ffmpeg -hide_banner -h "filter=$f" | head -1 | grep -q "^Filter $f" \
              || { echo "missing filter: $f"; exit 1; }
          done
          for e in libx264 aac; do
            ffmpeg -hide_banner -h "encoder=$e" | head -1 | grep -q "^Encoder $e" \
              || { echo "missing encoder: $e"; exit 1; }
          done

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        run: uv sync ${{ matrix.extras }}

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: uv run pytest -v

      - name: Doctor
        # Must pass on a runner where only ffmpeg and uv were installed. Any required
        # dependency the doctor cannot see here is one the friend will hit too.
        run: uv run subtitler doctor

      - name: CLI smoke test
        run: |
          uv run subtitler --version
          uv run subtitler convert fixtures/groq_verbose.json -o /tmp/fixture.srt
          # No `|| true`: the splitter is required to produce a clean file. This is the
          # PRD acceptance criterion (<=2 lines of 42 chars, 1.0-7.0s, <=20 chars/sec).
          uv run subtitler lint /tmp/fixture.srt

      - name: Burn smoke test
        # The end-to-end path that only breaks on someone else's machine: libass, the
        # bundled font, the filter literal, and the yuv420p/duration flags.
        run: |
          uv run subtitler burn fixtures/tiny-10s.wav /tmp/fixture.srt -o /tmp/smoke.mp4
          ffprobe -v error -show_entries stream=width,height,pix_fmt -of default=nw=1 /tmp/smoke.mp4
          test -s /tmp/smoke.mp4

      - name: Burn with a hostile path
        # Spaces, a colon and a quote in both the directory and the filename. This is the
        # acceptance test for writing subs.ass into a temp dir and running ffmpeg with cwd
        # set there instead of escaping a real path into the filtergraph.
        run: |
          mkdir -p "/tmp/a dir: with 'quotes'"
          cp fixtures/tiny-10s.wav "/tmp/a dir: with 'quotes'/a file: with 'quotes'.wav"
          uv run subtitler burn "/tmp/a dir: with 'quotes'/a file: with 'quotes'.wav" \
            /tmp/fixture.srt -o "/tmp/a dir: with 'quotes'/out: file.mp4"
          test -s "/tmp/a dir: with 'quotes'/out: file.mp4"

      - name: Local transcription
        # The whole point of the macOS job: prove mlx actually transcribes on Apple
        # Silicon, not merely that the code path is reachable. `tiny` keeps CI to ~75 MB
        # and a few seconds; it is far too weak for Serbian and is never a default.
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          uv run subtitler models download tiny
          uv run subtitler models list
          uv run subtitler run fixtures/tiny-10s.wav --model tiny --srt-only -o /tmp/local
          test -s /tmp/local/tiny-10s.srt
          uv run subtitler lint /tmp/local/tiny-10s.srt
          echo "--- transcript ---"
          cat /tmp/local/tiny-10s.srt

      - name: Render the diacritics frame
        # č ć đ š ž must come out of the bundled font identically on both platforms.
        # Phase 4 turns this into a pixel diff against a checked-in reference.
        run: |
          printf '1\n00:00:01,000 --> 00:00:04,000\nČĆĐŠŽ čćđšž\n' > /tmp/diacritics.srt
          uv run subtitler burn fixtures/tiny-10s.wav /tmp/diacritics.srt -o /tmp/diacritics.mp4
          ffmpeg -v error -y -ss 2 -i /tmp/diacritics.mp4 -frames:v 1 /tmp/diacritics.png
          test -s /tmp/diacritics.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ matrix.os }}
          path: |
            /tmp/diacritics.png
            /tmp/smoke.mp4
          if-no-files-found: warn
